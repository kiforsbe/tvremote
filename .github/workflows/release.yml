name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release (e.g. v1.0.0)'
        required: true
        type: string
      draft:
        description: 'Create release as draft (requires manual publish on GitHub)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx electron-builder --publish never # build only; the release step below publishes

      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          version="${{ inputs.tag }}"
          node scripts/release.js --notes "${version#v}" > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          draft: ${{ inputs.draft }}
          body_path: release-notes.md
          files: dist/*.exe
