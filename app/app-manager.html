<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Apps</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { height: 100%; border-radius: 8px; overflow: hidden; }

    body {
      height: 100%;
      font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      color: rgba(255,255,255,0.95);
      background: transparent;
      display: flex;
      flex-direction: column;
    }

    /* ── Windows 11 title bar ───────────────────── */
    .title-bar {
      display: flex;
      align-items: center;
      height: 32px;
      flex-shrink: 0;
      -webkit-app-region: drag;
    }

    .title-bar-text {
      flex: 1;
      font-size: 12px;
      color: rgba(255,255,255,0.78);
      padding-left: 16px;
      user-select: none;
      pointer-events: none;
    }

    .caption-buttons {
      display: flex;
      align-self: stretch;
      -webkit-app-region: no-drag;
    }

    .caption-btn {
      width: 46px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: rgba(255,255,255,0.78);
      cursor: pointer;
      padding: 0;
      outline: none;
      transition: background 0.1s, color 0.1s;
    }
    .caption-btn:hover { background: rgba(255,255,255,0.07); }
    .caption-btn.close:hover { background: #c42b1c; color: #fff; }
    .caption-btn:disabled { opacity: 0.35; cursor: default; }
    .caption-btn:disabled:hover { background: transparent; }

    /* ── Content area ───────────────────────────── */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 4px 16px 16px;
      gap: 10px;
      overflow: hidden;
    }

    button, input, label, select { -webkit-app-region: no-drag; }

    .app-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
      -webkit-app-region: no-drag;
    }

    .app-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 6px;
      border-radius: 4px;
    }
    .app-row:hover { background: rgba(255,255,255,0.04); }

    .app-row input[type=checkbox] { width: 14px; height: 14px; accent-color: #0067c0; cursor: pointer; flex-shrink: 0; }

    .app-row-name { flex: 1; font-size: 13px; cursor: pointer; }
    .app-row-name.has-override::after {
      content: ' *';
      color: rgba(255,200,100,0.8);
      font-size: 11px;
    }

    input[type=text] {
      height: 30px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.09);
      border-bottom-color: rgba(255,255,255,0.45);
      border-radius: 4px;
      color: rgba(255,255,255,0.95);
      font-family: inherit;
      font-size: 13px;
      padding: 0 10px;
      outline: none;
    }
    input[type=text]:focus { border-bottom-color: #60cdff; }
    input[type=text]:disabled {
      opacity: 0.5;
      cursor: default;
      border-bottom-color: rgba(255,255,255,0.2);
    }

    .actions { display: flex; gap: 8px; justify-content: space-between; align-items: center; flex-shrink: 0; }
    .actions-group { display: flex; gap: 8px; }

    .btn-action {
      height: 32px; min-width: 80px; padding: 0 16px;
      border-radius: 4px; font-family: inherit; font-size: 14px;
      cursor: pointer; border: 1px solid transparent;
    }
    .btn-cancel { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.09); color: rgba(255,255,255,0.95); }
    .btn-cancel:hover { background: rgba(255,255,255,0.1); }
    .btn-save   { background: #0067c0; color: #fff; }
    .btn-save:hover { background: #1975c9; }

    /* ── Windows 11 scrollbar ───────────────────── */
    #app-list::-webkit-scrollbar         { width: 6px; }
    #app-list::-webkit-scrollbar-track   { background: transparent; }
    #app-list::-webkit-scrollbar-thumb   {
      background: rgba(255,255,255,0.22);
      border-radius: 3px;
    }
    #app-list::-webkit-scrollbar-thumb:hover {
      background: rgba(255,255,255,0.4);
    }

    /* ── Dialog drag-and-drop ───────────────────── */
    .drag-handle {
      font-size: 12px;
      color: rgba(255,255,255,0.3);
      cursor: grab;
      flex-shrink: 0;
      width: 16px;
      text-align: center;
      user-select: none;
      -webkit-app-region: no-drag;
    }
    .drag-handle:active { cursor: grabbing; }
    .app-row.dragging         { opacity: 0.4; }
    .app-row.drag-over-top    { box-shadow: 0 -2px 0 0 #60cdff; }
    .app-row.drag-over-bottom { box-shadow: 0  2px 0 0 #60cdff; }

    /* ── Header controls row ─────────────────────── */
    .header-controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      flex-shrink: 0;
    }

    .region-select {
      height: 24px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 4px;
      color: rgba(255,255,255,0.7);
      font-family: inherit; font-size: 12px;
      cursor: pointer;
      padding: 0 6px;
      outline: none;
    }
    .region-select option { background: #1f1f1f; color: rgba(255,255,255,0.9); }

    .btn-sync {
      height: 24px; padding: 0 10px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 4px;
      color: rgba(255,255,255,0.7);
      font-family: inherit; font-size: 12px;
      cursor: pointer; flex-shrink: 0;
    }
    .btn-sync:hover:not(:disabled) { background: rgba(255,255,255,0.1); }
    .btn-sync:disabled { opacity: 0.4; cursor: default; }

    /* ── Sync state indicators ──────────────────── */
    .app-row.unavailable { opacity: 0.4; }
    .app-row.unavailable .app-row-name::after {
      content: ' — not on TV';
      font-size: 10px;
    }
    .app-row.confirmed .app-row-name::after {
      content: ' ✓';
      font-size: 10px;
      color: #60cdff;
    }

    /* ── Right-click context menu ───────────────── */
    #ctx-menu {
      position: fixed;
      z-index: 100;
      background: #2d2d2d;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px;
      padding: 4px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      min-width: 140px;
      display: none;
      -webkit-app-region: no-drag;
    }
    #ctx-menu.visible { display: block; }
    .ctx-item {
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      color: rgba(255,255,255,0.9);
      white-space: nowrap;
    }
    .ctx-item:hover { background: rgba(255,255,255,0.08); }
    .ctx-item.danger { color: rgba(255,100,100,0.9); }
    .ctx-item.danger:hover { background: rgba(255,80,80,0.12); }

    /* ── Samsung DB search (inside Add dialog) ─── */
    .dialog-search { display: flex; flex-direction: column; gap: 4px; }
    #dialog-db-search {
      height: 30px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.09);
      border-bottom-color: rgba(255,255,255,0.45);
      border-radius: 4px;
      color: rgba(255,255,255,0.95);
      font-family: inherit; font-size: 13px;
      padding: 0 10px;
      outline: none;
      width: 100%;
    }
    #dialog-db-search:focus { border-bottom-color: #60cdff; }
    #dialog-db-results {
      max-height: 270px; /* ~10 rows */
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    #dialog-db-results:empty { display: none; }
    #dialog-db-results::-webkit-scrollbar       { width: 4px; }
    #dialog-db-results::-webkit-scrollbar-track { background: transparent; }
    #dialog-db-results::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }
    .db-result {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 27px;
      padding: 0 8px;
      border-radius: 3px;
      cursor: pointer;
      gap: 8px;
      flex-shrink: 0;
    }
    .db-result:hover { background: rgba(255,255,255,0.07); }
    .db-result-name { font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .db-result-id   { font-size: 11px; color: rgba(255,255,255,0.35); font-family: 'Cascadia Code', 'Consolas', monospace; flex-shrink: 0; }
    .db-search-sep {
      font-size: 11px;
      color: rgba(255,255,255,0.3);
      text-align: center;
      padding: 4px 0 2px;
    }

    /* ── Reset button ───────────────────────────── */
    .btn-reset {
      height: 24px; padding: 0 10px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 4px;
      color: rgba(255,255,255,0.7);
      font-family: inherit; font-size: 12px;
      cursor: pointer; flex-shrink: 0;
    }
    .btn-reset:hover { background: rgba(255,255,255,0.1); }

    /* ── App dialog (add / edit / set ID) ──────── */
    #app-dialog-overlay {
      position: fixed; inset: 0;
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.45);
      -webkit-app-region: no-drag;
    }
    #app-dialog-overlay.visible { display: flex; }

    #app-dialog {
      background: #252525;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 18px 20px 16px;
      width: 360px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    #app-dialog h2 { font-size: 13px; font-weight: 600; }
    .dialog-field { display: flex; flex-direction: column; gap: 4px; }
    .dialog-field label { font-size: 11px; color: rgba(255,255,255,0.5); }
    .dialog-hint {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      font-family: 'Cascadia Code', 'Consolas', monospace;
      margin-top: -4px;
    }
    #dialog-appid-input {
      font-family: 'Cascadia Code', 'Consolas', monospace;
      font-size: 12px;
    }
    .popup-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .popup-actions button {
      height: 28px; padding: 0 14px;
      border-radius: 4px; font-family: inherit; font-size: 13px;
      cursor: pointer; border: 1px solid transparent;
    }
    #dialog-cancel { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.09); color: rgba(255,255,255,0.9); }
    #dialog-cancel:hover { background: rgba(255,255,255,0.1); }
    #dialog-ok     { background: #0067c0; color: #fff; }
    #dialog-ok:hover { background: #1975c9; }
  </style>
</head>
<body>

  <!-- Windows 11 title bar -->
  <div class="title-bar">
    <span class="title-bar-text">Manage Apps</span>
    <div class="caption-buttons">
      <button class="caption-btn" id="btn-minimize" title="Minimize">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
          <path d="M1 5h8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="caption-btn" id="btn-maximize" title="Maximize">
        <svg id="icon-maximize" width="10" height="10" viewBox="0 0 10 10" fill="none">
          <rect x="1" y="1" width="8" height="8" rx="1" stroke="currentColor" stroke-width="1.2"/>
        </svg>
      </button>
      <button class="caption-btn close" id="btn-close" title="Close">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
          <path d="M1 1l8 8M9 1L1 9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Content -->
  <div class="content">
    <div class="header-controls">
      <select id="region-select" class="region-select"></select>
      <button class="btn-reset" id="btn-reset">Reset to defaults</button>
      <button class="btn-sync" id="btn-sync">Sync with TV</button>
    </div>

    <div class="app-list" id="app-list"></div>

    <div class="actions">
      <button class="btn-action btn-cancel" id="btn-add-app">+ Add app</button>
      <div class="actions-group">
        <button class="btn-action btn-cancel" id="btn-cancel">Cancel</button>
        <button class="btn-action btn-save"   id="btn-save">Save</button>
      </div>
    </div>
  </div>

  <!-- Right-click context menu -->
  <div id="ctx-menu">
    <div class="ctx-item" id="ctx-edit">Set App ID…</div>
    <div class="ctx-item" id="ctx-reset-id" style="display:none">Reset to default</div>
    <div class="ctx-item danger" id="ctx-remove" style="display:none">Remove</div>
  </div>

  <!-- Unified app dialog (add / edit / set ID) -->
  <div id="app-dialog-overlay">
    <div id="app-dialog">
      <h2 id="dialog-title">Add App</h2>
      <div class="dialog-search" id="dialog-search-section">
        <input type="search" id="dialog-db-search" placeholder="Search Samsung apps…" autocomplete="off">
        <div id="dialog-db-results"></div>
        <div class="db-search-sep" id="dialog-search-sep">— or enter manually —</div>
      </div>
      <div class="dialog-field">
        <label>App name</label>
        <input type="text" id="dialog-name-input" placeholder="e.g. My Channel" autocomplete="off">
      </div>
      <div class="dialog-field">
        <label>Samsung App ID</label>
        <input type="text" id="dialog-appid-input" placeholder="e.g. 3201601007625" spellcheck="false" autocomplete="off">
        <div class="dialog-hint" id="dialog-hint"></div>
      </div>
      <div class="popup-actions">
        <button id="dialog-cancel">Cancel</button>
        <button id="dialog-ok">Add</button>
      </div>
    </div>
  </div>

  <script src="catalog.js"></script>
  <script>
    const params        = new URLSearchParams(location.search);
    let enabledApps     = JSON.parse(params.get('apps') || '[]');
    const ip            = params.get('ip')     || '';
    let selectedRegion  = params.get('region') || 'US';
    let tvAvailable     = null; // null = not synced; Set<appId> after sync

    // Per-catalog-app overrides: catalogId → custom appId string.
    // Cleared when the user switches region (region brings its own IDs).
    const appIdOverrides = new Map();

    // ── Caption buttons ──────────────────────────────────────────────────────
    const ICON_MAXIMIZE = `<rect x="1" y="1" width="8" height="8" rx="1" stroke="currentColor" stroke-width="1.2"/>`;
    const ICON_RESTORE  = `<rect x="2.5" y="0.5" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.2"/>
                            <rect x="0.5" y="2.5" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.2"/>`;

    document.getElementById('btn-minimize').onclick = () => window.appManagerAPI.minimize();
    document.getElementById('btn-maximize').onclick = () => window.appManagerAPI.maximize();
    document.getElementById('btn-close').onclick    = () => window.appManagerAPI.cancel();

    window.appManagerAPI.onWindowState(isMaximized => {
      document.getElementById('icon-maximize').innerHTML = isMaximized ? ICON_RESTORE : ICON_MAXIMIZE;
      document.getElementById('btn-maximize').title = isMaximized ? 'Restore Down' : 'Maximize';
    });

    // ── Region selector ──────────────────────────────────────────────────────
    const regionSel = document.getElementById('region-select');
    REGIONS.forEach(r => {
      const opt = document.createElement('option');
      opt.value = r.id;
      opt.textContent = r.label;
      regionSel.appendChild(opt);
    });
    regionSel.value = selectedRegion;

    regionSel.onchange = () => applyRegion(regionSel.value);

    function applyRegion(newRegion) {
      selectedRegion = newRegion;
      appIdOverrides.clear();
      const newCat = getCatalogForRegion(newRegion);
      const catMap = new Map(newCat.map(a => [a.id, a]));

      enabledApps = enabledApps
        .map(app => app.custom ? app : (catMap.get(app.id) ? { ...catMap.get(app.id) } : null))
        .filter(Boolean);

      tvAvailable = null;
      render();
      if (!document.getElementById('app-dialog-overlay').classList.contains('visible')) return;
      document.getElementById('dialog-db-search').value = '';
      updateDbSearch();
    }

    function effectiveAppId(app) {
      return appIdOverrides.has(app.id) ? appIdOverrides.get(app.id) : app.appId;
    }

    // ── Catalog helpers ──────────────────────────────────────────────────────
    function getCatalogForRegion(region) {
      return APP_CATALOG
        .filter(a => a.available.length === 0 || a.available.includes(region))
        .map(a => ({
          id:       a.id,
          name:     a.name,
          icon:     a.icon,
          appId:    a.appIds[region] || a.appIds.default,
          deepLink: a.deepLink || false,
        }));
    }

    // Seed enabledApps from region defaults when nothing saved yet
    if (enabledApps.length === 0) {
      const cat      = getCatalogForRegion(selectedRegion);
      const catMap   = new Map(cat.map(a => [a.id, a]));
      const defaults = REGION_DEFAULTS[selectedRegion] || [];
      enabledApps    = defaults.map(id => catMap.get(id)).filter(Boolean);
    }

    // ── Render ───────────────────────────────────────────────────────────────
    function buildRows() {
      const cat        = getCatalogForRegion(selectedRegion);
      const enabledIds = new Set(enabledApps.map(a => a.id));
      const disabled   = cat.filter(a => !enabledIds.has(a.id));
      return [
        ...enabledApps.map(a => ({ ...a, enabled: true })),
        ...disabled.map(a => ({ ...a, enabled: false })),
      ];
    }

    function render() {
      const list = document.getElementById('app-list');
      list.innerHTML = '';
      const rows = buildRows();

      rows.forEach(app => {
        const appId = effectiveAppId(app);

        const rowEl = document.createElement('div');
        rowEl.className = 'app-row';
        rowEl.dataset.id = app.id;

        if (tvAvailable !== null && !app.custom) {
          if (appId && tvAvailable.has(appId)) {
            rowEl.classList.add('confirmed');
          } else {
            rowEl.classList.add('unavailable');
          }
        }

        if (app.enabled) {
          rowEl.draggable = true;
          const handle = document.createElement('span');
          handle.className = 'drag-handle';
          handle.textContent = '⠿';
          rowEl.appendChild(handle);
        }

        const cb = document.createElement('input');
        cb.type    = 'checkbox';
        cb.checked = app.enabled;
        cb.onchange = () => {
          if (cb.checked) {
            enabledApps.push({ ...app, appId: effectiveAppId(app) });
          } else {
            enabledApps = enabledApps.filter(a => a.id !== app.id);
          }
          render();
        };

        const nameEl = document.createElement('span');
        nameEl.className = 'app-row-name';
        if (appIdOverrides.has(app.id)) nameEl.classList.add('has-override');
        nameEl.textContent = app.icon + ' ' + app.name;
        nameEl.onclick = () => { cb.checked = !cb.checked; cb.onchange(); };

        rowEl.appendChild(cb);
        rowEl.appendChild(nameEl);
        list.appendChild(rowEl);
      });
    }

    render();

    // ── Reset to defaults ────────────────────────────────────────────────────
    document.getElementById('btn-reset').onclick = () => {
      const cat      = getCatalogForRegion(selectedRegion);
      const catMap   = new Map(cat.map(a => [a.id, a]));
      const defaults = REGION_DEFAULTS[selectedRegion] || [];
      enabledApps    = defaults.map(id => catMap.get(id)).filter(Boolean);
      tvAvailable    = null;
      render();
    };

    // ── Samsung DB search ────────────────────────────────────────────────────
    let _samsungDb = null;

    async function ensureSamsungDb() {
      if (!_samsungDb) _samsungDb = await window.appManagerAPI.getSamsungDb();
    }

    function ccForRegion(region) {
      return Object.entries(CC_TO_REGION)
        .filter(([, rid]) => rid === region)
        .map(([cc]) => cc);
    }

    function updateDbSearch() {
      const query   = document.getElementById('dialog-db-search').value.trim().toLowerCase();
      const results = document.getElementById('dialog-db-results');
      const sep     = document.getElementById('dialog-search-sep');
      results.innerHTML = '';

      if (!_samsungDb) { sep.hidden = true; return; }

      const regionCCs = new Set(ccForRegion(selectedRegion));
      let matches = _samsungDb.filter(a => a.regions.some(cc => regionCCs.has(cc)));
      if (query.length > 0) {
        matches = matches.filter(a => a.name.toLowerCase().includes(query));
      }

      sep.hidden = matches.length === 0;

      const addedIds = new Set(enabledApps.map(a => a.appId));
      for (const dbApp of matches) {
        const appId   = String(dbApp.id);
        const isAdded = addedIds.has(appId);
        const row = document.createElement('div');
        row.className = 'db-result';
        row.innerHTML =
          `<span class="db-result-name">${dbApp.name}</span>` +
          `<span class="db-result-id">${appId}</span>`;
        if (!isAdded) {
          row.onclick = () => {
            document.getElementById('dialog-name-input').value  = dbApp.name;
            document.getElementById('dialog-appid-input').value = appId;
            document.getElementById('dialog-db-search').value   = '';
            results.innerHTML = '';
            sep.hidden = true;
            document.getElementById('dialog-appid-input').focus();
          };
        } else {
          row.style.opacity = '0.4';
          row.style.cursor  = 'default';
        }
        results.appendChild(row);
      }
    }

    // ── Right-click context menu ─────────────────────────────────────────────
    (function () {
      const menu       = document.getElementById('ctx-menu');
      const itemEdit   = document.getElementById('ctx-edit');
      const itemReset  = document.getElementById('ctx-reset-id');
      const itemRemove = document.getElementById('ctx-remove');
      let _ctxApp      = null;

      function hideMenu() {
        menu.classList.remove('visible');
        _ctxApp = null;
      }

      document.getElementById('app-list').addEventListener('contextmenu', e => {
        e.preventDefault();
        const row = e.target.closest('.app-row');
        if (!row) return;

        const id   = row.dataset.id;
        const rows = buildRows();
        _ctxApp = rows.find(a => a.id === id) || null;
        if (!_ctxApp) return;

        const isCustom = !!_ctxApp.custom;
        itemEdit.textContent       = isCustom ? 'Edit…' : 'Set App ID…';
        itemReset.style.display    = (!isCustom && appIdOverrides.has(id)) ? '' : 'none';
        itemRemove.style.display   = isCustom ? '' : 'none';

        const visibleItems = 1 + (itemReset.style.display ? 0 : 1) + (isCustom ? 1 : 0);
        const mw = 160, mh = visibleItems * 34 + 8;
        const x  = Math.min(e.clientX, window.innerWidth  - mw - 8);
        const y  = Math.min(e.clientY, window.innerHeight - mh - 8);
        menu.style.left = x + 'px';
        menu.style.top  = y + 'px';
        menu.classList.add('visible');
      });

      document.addEventListener('mousedown', e => {
        if (!menu.contains(e.target)) hideMenu();
      });

      itemEdit.onclick = () => {
        if (!_ctxApp) return;
        const app = _ctxApp;
        hideMenu();
        openAppDialog(app.custom ? 'edit-custom' : 'set-id', app);
      };

      itemReset.onclick = () => {
        if (!_ctxApp) return;
        const id = _ctxApp.id;
        appIdOverrides.delete(id);
        const idx = enabledApps.findIndex(a => a.id === id);
        if (idx !== -1) {
          const cat    = getCatalogForRegion(selectedRegion);
          const catApp = cat.find(a => a.id === id);
          if (catApp) enabledApps[idx] = { ...enabledApps[idx], appId: catApp.appId };
        }
        tvAvailable = null;
        hideMenu();
        render();
      };

      itemRemove.onclick = () => {
        if (!_ctxApp) return;
        enabledApps = enabledApps.filter(a => a.id !== _ctxApp.id);
        hideMenu();
        render();
      };
    })();

    // ── Unified app dialog ────────────────────────────────────────────────────
    // mode: 'add'         → add new custom app (both fields editable, "Add" button)
    // mode: 'edit-custom' → edit existing custom app (both fields editable, "Save" button)
    // mode: 'set-id'      → override catalog app's ID (name disabled, "OK" button)
    function openAppDialog(mode, app) {
      const overlay      = document.getElementById('app-dialog-overlay');
      const titleEl      = document.getElementById('dialog-title');
      const nameInput    = document.getElementById('dialog-name-input');
      const idInput      = document.getElementById('dialog-appid-input');
      const hintEl       = document.getElementById('dialog-hint');
      const okBtn        = document.getElementById('dialog-ok');
      const searchSec    = document.getElementById('dialog-search-section');
      const dbSearchEl   = document.getElementById('dialog-db-search');
      const dbResultsEl  = document.getElementById('dialog-db-results');
      const dbSepEl      = document.getElementById('dialog-search-sep');

      if (mode === 'add') {
        titleEl.textContent    = 'Add App';
        okBtn.textContent      = 'Add';
        nameInput.value        = '';
        nameInput.disabled     = false;
        idInput.value          = '';
        hintEl.textContent     = '';
        searchSec.hidden       = false;
        dbSearchEl.value       = '';
        dbResultsEl.innerHTML  = '';
        dbSepEl.hidden         = true;
        ensureSamsungDb().then(() => updateDbSearch());
      } else if (mode === 'edit-custom') {
        titleEl.textContent    = 'Edit App';
        okBtn.textContent      = 'Save';
        nameInput.value        = app.name;
        nameInput.disabled     = false;
        idInput.value          = app.appId || '';
        hintEl.textContent     = '';
        searchSec.hidden       = true;
      } else { // 'set-id'
        titleEl.textContent    = app.name;
        okBtn.textContent      = 'OK';
        nameInput.value        = app.name;
        nameInput.disabled     = true;
        idInput.value          = effectiveAppId(app) || '';
        hintEl.textContent     = app.appId ? 'catalog default: ' + app.appId : '';
        searchSec.hidden       = true;
      }

      overlay.classList.add('visible');
      setTimeout(() => {
        if (mode === 'add') {
          dbSearchEl.focus();
        } else {
          const focusTarget = nameInput.disabled ? idInput : nameInput;
          focusTarget.focus();
          focusTarget.select();
        }
      }, 50);

      dbSearchEl.oninput = () => updateDbSearch();
      dbSearchEl.onkeydown = e => {
        if (e.key === 'Enter')  e.preventDefault();
        if (e.key === 'Escape') { e.preventDefault(); close(); }
      };

      function confirm() {
        const name  = nameInput.value.trim();
        const appId = idInput.value.trim();
        if (!appId) return;

        if (mode === 'add') {
          if (!name) return;
          enabledApps.push({ id: 'custom-' + Date.now(), name, icon: '★', appId, deepLink: false, custom: true });
        } else if (mode === 'edit-custom') {
          if (!name) return;
          const idx = enabledApps.findIndex(a => a.id === app.id);
          if (idx !== -1) enabledApps[idx] = { ...enabledApps[idx], name, appId };
        } else { // 'set-id'
          if (appId !== app.appId) {
            appIdOverrides.set(app.id, appId);
            const idx = enabledApps.findIndex(a => a.id === app.id);
            if (idx !== -1) enabledApps[idx] = { ...enabledApps[idx], appId };
          } else {
            appIdOverrides.delete(app.id);
          }
        }

        tvAvailable = null;
        close();
        render();
      }

      function close() {
        overlay.classList.remove('visible');
        okBtn.onclick                                       = null;
        document.getElementById('dialog-cancel').onclick   = null;
        nameInput.onkeydown = idInput.onkeydown             = null;
        dbSearchEl.oninput   = null;
        dbSearchEl.onkeydown = null;
      }

      okBtn.onclick = confirm;
      document.getElementById('dialog-cancel').onclick = close;
      const onKey = e => {
        if (e.key === 'Enter')  { e.preventDefault(); confirm(); }
        if (e.key === 'Escape') { e.preventDefault(); close(); }
      };
      nameInput.onkeydown = idInput.onkeydown = onKey;
    }

    // ── Sync with TV ─────────────────────────────────────────────────────────
    (function () {
      const btn = document.getElementById('btn-sync');
      if (!ip) { btn.disabled = true; btn.title = 'No TV IP configured'; return; }

      btn.onclick = async () => {
        btn.disabled = true;
        btn.textContent = 'Syncing…';

        try {
          const info = await window.appManagerAPI.getTvInfo(ip);
          if (info && info.countryCode) {
            const detected = CC_TO_REGION[info.countryCode];
            if (detected && detected !== selectedRegion) {
              selectedRegion = detected;
              regionSel.value = detected;
              applyRegion(detected);
            }
          }
        } catch (_) {}

        const cat    = getCatalogForRegion(selectedRegion);
        const appIds = cat.map(a => effectiveAppId(a)).filter(Boolean);

        let result;
        try {
          result = await window.appManagerAPI.probeTvApps(ip, appIds);
        } catch (e) {
          result = { error: e.message };
        }

        if (result.error) {
          btn.textContent = 'Failed';
        } else {
          tvAvailable = new Set(result.available);
          btn.textContent = `Synced · ${result.available.length} apps`;
          render();
        }

        setTimeout(() => { btn.textContent = 'Sync with TV'; btn.disabled = !ip; }, 3000);
      };
    })();

    // ── Drag-and-drop ────────────────────────────────────────────────────────
    (function () {
      const list = document.getElementById('app-list');
      let _ddIdx = null;

      list.addEventListener('dragstart', e => {
        const row = e.target.closest('[draggable]');
        if (!row) return;
        _ddIdx = enabledApps.findIndex(a => a.id === row.dataset.id);
        if (_ddIdx === -1) { _ddIdx = null; return; }
        row.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });

      list.addEventListener('dragover', e => {
        e.preventDefault();
        const row = e.target.closest('[draggable]');
        list.querySelectorAll('.drag-over-top, .drag-over-bottom').forEach(el =>
          el.classList.remove('drag-over-top', 'drag-over-bottom'));
        if (!row || _ddIdx === null) return;
        const rect = row.getBoundingClientRect();
        row.classList.add(e.clientY < rect.top + rect.height / 2 ? 'drag-over-top' : 'drag-over-bottom');
      });

      list.addEventListener('drop', e => {
        e.preventDefault();
        const row = e.target.closest('[draggable]');
        if (!row || _ddIdx === null) return;
        const targetId  = row.dataset.id;
        const targetIdx = enabledApps.findIndex(a => a.id === targetId);
        const rect      = row.getBoundingClientRect();
        const toIdx     = e.clientY < rect.top + rect.height / 2 ? targetIdx : targetIdx + 1;
        if (_ddIdx !== toIdx && _ddIdx + 1 !== toIdx) {
          const next = enabledApps.slice();
          const [item] = next.splice(_ddIdx, 1);
          next.splice(_ddIdx < toIdx ? toIdx - 1 : toIdx, 0, item);
          enabledApps = next;
          render();
        }
        _ddIdx = null;
      });

      list.addEventListener('dragend', () => {
        _ddIdx = null;
        list.querySelectorAll('.dragging, .drag-over-top, .drag-over-bottom').forEach(el =>
          el.classList.remove('dragging', 'drag-over-top', 'drag-over-bottom'));
      });
    })();

    // ── Add app button ────────────────────────────────────────────────────────
    document.getElementById('btn-add-app').onclick = () => openAppDialog('add', null);

    // ── Save / Cancel ────────────────────────────────────────────────────────
    document.getElementById('btn-save').onclick = () =>
      window.appManagerAPI.save(JSON.stringify({ apps: enabledApps, region: selectedRegion }));
    document.getElementById('btn-cancel').onclick = () => window.appManagerAPI.cancel();

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !document.getElementById('app-dialog-overlay').classList.contains('visible')) {
        window.appManagerAPI.cancel();
      }
    });
  </script>
</body>
</html>
