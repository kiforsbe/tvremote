<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TV Remote">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>TV Remote</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    :root {
      --bg:          #0f0f0f;
      --remote-body: #141414;
      --btn:         #1e1e1e;
      --btn-hover:   #2a2a2a;
      --btn-active:  #333333;
      --text:        #e0e0e0;
      --text-dim:    #555555;
      --power-red:   #c0392b;
      --power-hover: #e74c3c;
    }

    body {
      background: transparent;
      color: var(--text);
      font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-top:    max(16px, env(safe-area-inset-top));
      padding-right:  max(8px,  env(safe-area-inset-right));
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      padding-left:   max(8px,  env(safe-area-inset-left));
      gap: 14px;
      -webkit-app-region: drag;
    }

    button, input, a {
      -webkit-app-region: no-drag;
    }

    button { outline: none; }

    /* ── Remote body ────────────────────────── */
    .remote {
      background: var(--remote-body);
      border-radius: 28px;
      width: 180px;
      padding: 20px 16px 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      box-shadow:
        0 10px 40px rgba(0,0,0,0.8),
        inset 0 1px 0 rgba(255,255,255,0.04);
    }

    /* ── Generic button ─────────────────────── */
    .btn {
      background: var(--btn);
      border: none;
      color: var(--text);
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .btn:hover  { background: var(--btn-hover); }
    .btn:active { background: var(--btn-active); }

    /* ── Status LED ─────────────────────────── */
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #2a2a2a, #111);
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
      flex-shrink: 0;
      cursor: pointer;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .status-dot.connecting {
      background: radial-gradient(circle at 35% 30%, #ffd166, #e67e22);
      box-shadow: 0 0 6px 2px rgba(230,126,34,0.55),
                  inset 0 1px 2px rgba(255,255,255,0.25);
    }

    .status-dot.ok {
      background: radial-gradient(circle at 35% 30%, #6ee88a, #27ae60);
      box-shadow: 0 0 6px 2px rgba(39,174,96,0.55),
                  inset 0 1px 2px rgba(255,255,255,0.25);
    }

    .status-dot.err {
      background: radial-gradient(circle at 35% 30%, #f1665a, #c0392b);
      box-shadow: 0 0 6px 2px rgba(192,57,43,0.55),
                  inset 0 1px 2px rgba(255,255,255,0.25);
    }

    /* ── Settings button ────────────────────── */
    .btn-settings {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.12s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .btn-settings:hover  { color: var(--text); }
    .btn-settings:active { color: var(--text); }
    .btn-settings.open   { color: var(--text); }

    /* ── IP row (hidden until gear is clicked) ── */
    .ip-row {
      width: 100%;
      display: flex;
      gap: 6px;
    }

    .ip-row input {
      flex: 1;
      min-width: 0;
      background: var(--btn);
      border: 1px solid #2a2a2a;
      color: var(--text);
      padding: 6px 8px;
      border-radius: 8px;
      font-size: 11px;
      outline: none;
    }

    .ip-row input:focus { border-color: #555; }

    .ip-row .btn-apply {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 12px;
      flex-shrink: 0;
    }

    /* ── Power ──────────────────────────────── */
    .power-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }

    .btn-power {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--power-red);
      font-size: 15px;
    }

    .btn-power:hover  { background: var(--power-hover); }
    .btn-power:active { background: var(--power-red); }

    /* ── Top row (123 / color) ──────────────── */
    .row { display: flex; gap: 8px; }

    .btn-sm {
      width: 60px;
      min-height: 44px;
      border-radius: 8px;
      font-size: 12px;
    }

    /* ── Navigation ring ────────────────────── */
    .nav-ring {
      position: relative;
      width: 116px;
      height: 116px;
      flex-shrink: 0;
      border-radius: 50%;
      overflow: hidden;
    }

    .nav-track {
      position: absolute;
      inset: 0;
      background: var(--btn);
    }

    .nav-dir {
      position: absolute;
      inset: 0;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 11px;
      cursor: pointer;
      display: flex;
      transition: background 0.12s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .nav-dir:hover  { background: rgba(255,255,255,0.07); }
    .nav-dir:active { background: rgba(255,255,255,0.14); }

    /* Each button is clipped to its quadrant triangle */
    .nav-up    { clip-path: polygon(0% 0%, 100% 0%, 50% 50%);     align-items: flex-start; justify-content: center;   padding-top:    9px; }
    .nav-down  { clip-path: polygon(0% 100%, 100% 100%, 50% 50%); align-items: flex-end;   justify-content: center;   padding-bottom: 9px; }
    .nav-left  { clip-path: polygon(0% 0%, 0% 100%, 50% 50%);     align-items: center;     justify-content: flex-start; padding-left:  9px; }
    .nav-right { clip-path: polygon(100% 0%, 100% 100%, 50% 50%); align-items: center;     justify-content: flex-end;   padding-right: 9px; }

    .nav-ok {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      z-index: 1;
      background: var(--btn-hover);
      border: none;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .nav-ok:hover  { background: var(--btn-active); }
    .nav-ok:active { background: #3d3d3d; }

    /* ── Icon row: Back / Home / Play ───────── */
    .icon-row { display: flex; gap: 12px; }

    .btn-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 16px;
    }

    /* ── Rockers ────────────────────────────── */
    .rockers { display: flex; gap: 22px; }

    .rocker {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .rocker-label {
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .btn-rocker {
      width: 48px;
      min-height: 44px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 300;
    }

    /* ── Last-pressed flash ─────────────────── */
    @keyframes btn-flash {
      0%   { box-shadow: inset 0 0 0 100px rgba(255,255,255,0.28); }
      100% { box-shadow: inset 0 0 0 100px rgba(255,255,255,0);    }
    }

    .btn-flash { animation: btn-flash 0.8s ease-out; }
  </style>
</head>
<body>

  <div class="remote">

    <div class="power-row">
      <div class="status-dot" id="status-dot"></div>
      <button class="btn-settings" id="btn-settings" onclick="openSettings()" title="Set TV IP">⚙</button>
      <button class="btn btn-power" data-key="KEY_POWER" onclick="sendKey('KEY_POWER')">⏻</button>
    </div>

    <div class="ip-row" id="ip-row" hidden>
      <input id="tvip" type="text" inputmode="decimal" placeholder="192.168.x.x">
      <button class="btn btn-apply" onclick="applyIp()">▶</button>
    </div>

    <div class="row">
      <button class="btn btn-sm" data-key="KEY_123"   onclick="sendKey('KEY_123')">123</button>
      <button class="btn btn-sm" data-key="KEY_COLOR" onclick="sendKey('KEY_COLOR')">⬤⬤⬤</button>
    </div>

    <div class="nav-ring">
      <div class="nav-track"></div>
      <button class="nav-dir nav-up"    data-key="KEY_UP"    onclick="sendKey('KEY_UP')">▲</button>
      <button class="nav-dir nav-down"  data-key="KEY_DOWN"  onclick="sendKey('KEY_DOWN')">▼</button>
      <button class="nav-dir nav-left"  data-key="KEY_LEFT"  onclick="sendKey('KEY_LEFT')">◀</button>
      <button class="nav-dir nav-right" data-key="KEY_RIGHT" onclick="sendKey('KEY_RIGHT')">▶</button>
      <button class="nav-ok"            data-key="KEY_ENTER" onclick="sendKey('KEY_ENTER')">OK</button>
    </div>

    <div class="icon-row">
      <button class="btn btn-icon" data-key="KEY_BACK" title="Back"       onclick="sendKey('KEY_BACK')">↩</button>
      <button class="btn btn-icon" data-key="KEY_HOME" title="Home"       onclick="sendKey('KEY_HOME')">⌂</button>
      <button class="btn btn-icon" data-key="KEY_PLAY" title="Play/Pause" onclick="sendKey('KEY_PLAY')">⏯</button>
    </div>

    <div class="rockers">
      <div class="rocker">
        <span class="rocker-label">VOL</span>
        <button class="btn btn-rocker" data-key="KEY_VOLUP"   onclick="sendKey('KEY_VOLUP')">+</button>
        <button class="btn btn-rocker" data-key="KEY_VOLDOWN" onclick="sendKey('KEY_VOLDOWN')">−</button>
      </div>
      <div class="rocker">
        <span class="rocker-label">CH</span>
        <button class="btn btn-rocker" data-key="KEY_CHUP"   onclick="sendKey('KEY_CHUP')">∧</button>
        <button class="btn btn-rocker" data-key="KEY_CHDOWN" onclick="sendKey('KEY_CHDOWN')">∨</button>
      </div>
    </div>

  </div>

  <script src="remote.js"></script>
</body>
</html>
