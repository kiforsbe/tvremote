<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TV Remote">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>TV Remote</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    :root {
      --bg:          #0f0f0f;
      --remote-body: #141414;
      --btn:         #1e1e1e;
      --btn-hover:   #2a2a2a;
      --btn-active:  #333333;
      --text:        #e0e0e0;
      --text-dim:    #555555;
      --power-red:   #c0392b;
      --power-hover: #e74c3c;
    }

    body {
      background: transparent;
      color: var(--text);
      font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-top:    max(16px, env(safe-area-inset-top));
      padding-right:  max(8px,  env(safe-area-inset-right));
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      padding-left:   max(8px,  env(safe-area-inset-left));
      gap: 14px;
      -webkit-app-region: drag;
    }

    button, input, a {
      -webkit-app-region: no-drag;
    }

    button { outline: none; }

    /* ── Remote body ────────────────────────── */
    .remote {
      background: var(--remote-body);
      border-radius: 28px;
      width: 180px;
      padding: 20px 16px 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      box-shadow:
        0 10px 40px rgba(0,0,0,0.8),
        inset 0 1px 0 rgba(255,255,255,0.04);
    }

    /* ── Generic button ─────────────────────── */
    .btn {
      background: var(--btn);
      border: none;
      color: var(--text);
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .btn:hover  { background: var(--btn-hover); }
    .btn:active { background: var(--btn-active); }

    /* ── Status LED ─────────────────────────── */
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #2a2a2a, #111);
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
      flex-shrink: 0;
      cursor: pointer;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .status-dot.connecting {
      background: radial-gradient(circle at 35% 30%, #ffd166, #e67e22);
      box-shadow: 0 0 6px 2px rgba(230,126,34,0.55),
                  inset 0 1px 2px rgba(255,255,255,0.25);
    }

    .status-dot.ok {
      background: radial-gradient(circle at 35% 30%, #6ee88a, #27ae60);
      box-shadow: 0 0 6px 2px rgba(39,174,96,0.55),
                  inset 0 1px 2px rgba(255,255,255,0.25);
    }

    .status-dot.err {
      background: radial-gradient(circle at 35% 30%, #f1665a, #c0392b);
      box-shadow: 0 0 6px 2px rgba(192,57,43,0.55),
                  inset 0 1px 2px rgba(255,255,255,0.25);
    }

    /* ── Settings / Source buttons ─────────── */
    .btn-settings, .btn-src {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.12s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .btn-settings { font-size: 13px; }
    .btn-src      { font-size: 8px; font-weight: 700; letter-spacing: 0.3px; }

    .btn-settings:hover, .btn-src:hover   { color: var(--text); }
    .btn-settings:active, .btn-src:active { color: var(--text); }
    .btn-settings.open                    { color: var(--text); }

    /* ── IP row (hidden until gear is clicked) ── */
    .ip-row {
      width: 100%;
      display: flex;
      gap: 6px;
    }

    .ip-row input {
      flex: 1;
      min-width: 0;
      background: var(--btn);
      border: 1px solid #2a2a2a;
      color: var(--text);
      padding: 6px 8px;
      border-radius: 8px;
      font-size: 11px;
      outline: none;
    }

    .ip-row input:focus { border-color: #555; }

    .ip-row .btn-apply {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 12px;
      flex-shrink: 0;
    }

    /* ── Power ──────────────────────────────── */
    .power-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }

    .btn-power {
      width: 40px;
      height: 20px;
      border-radius: 10px;
      background: var(--power-red);
      font-size: 11px;
    }

    .btn-power:hover  { background: var(--power-hover); }
    .btn-power:active { background: var(--power-red); }

    /* ── Top row (123 + colour dots) ───────── */
    .row { display: flex; gap: 6px; align-items: center; }

    .btn-sm {
      width: 52px;
      min-height: 36px;
      border-radius: 8px;
      font-size: 12px;
    }

    .btn-color {
      width: 16px;
      height: 16px;
      min-height: unset;
      border-radius: 50%;
      padding: 0;
      flex-shrink: 0;
    }

    .btn-red    { background: #e74c3c; }
    .btn-green  { background: #2ecc71; }
    .btn-yellow { background: #f1c40f; }
    .btn-blue   { background: #3498db; }

    .btn-red:hover    { background: #c0392b; }
    .btn-green:hover  { background: #27ae60; }
    .btn-yellow:hover { background: #d4a90e; }
    .btn-blue:hover   { background: #2980b9; }

    /* ── Navigation ring ────────────────────── */
    .nav-ring {
      position: relative;
      width: 116px;
      height: 116px;
      flex-shrink: 0;
      border-radius: 50%;
      overflow: hidden;
    }

    .nav-track {
      position: absolute;
      inset: 0;
      background: var(--btn);
    }

    .nav-dir {
      position: absolute;
      inset: 0;
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 13px;
      cursor: pointer;
      display: flex;
      transition: background 0.12s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .nav-dir:hover { color: var(--text); }

    .nav-dir:hover  { background: rgba(255,255,255,0.07); }
    .nav-dir:active { background: rgba(255,255,255,0.14); }

    /* Each button is clipped to its quadrant triangle */
    .nav-up    { clip-path: polygon(0% 0%, 100% 0%, 50% 50%);     align-items: flex-start; justify-content: center;   padding-top:    9px; }
    .nav-down  { clip-path: polygon(0% 100%, 100% 100%, 50% 50%); align-items: flex-end;   justify-content: center;   padding-bottom: 9px; }
    .nav-left  { clip-path: polygon(0% 0%, 0% 100%, 50% 50%);     align-items: center;     justify-content: flex-start; padding-left:  9px; }
    .nav-right { clip-path: polygon(100% 0%, 100% 100%, 50% 50%); align-items: center;     justify-content: flex-end;   padding-right: 9px; }

    .nav-ok {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      z-index: 1;
      background: var(--btn-hover);
      border: none;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .nav-ok:hover  { background: var(--btn-active); }
    .nav-ok:active { background: #3d3d3d; }

    /* ── Icon row: Back / Home / Play ───────── */
    .icon-row { display: flex; gap: 12px; }

    .btn-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 16px;
    }

    /* ── Rockers ────────────────────────────── */
    .rockers { display: flex; gap: 11px; }

    .rocker {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .rocker-mute { justify-content: center; }

    .rocker-label {
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .btn-rocker {
      width: 42px;
      min-height: 44px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 300;
    }

    /* ── Numpad panel ───────────────────────── */
    .numpad {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .numpad-row {
      display: flex;
      justify-content: center;
      gap: 3px;
    }

    .btn-digit {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: var(--btn);
      border: none;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .btn-digit:hover  { background: var(--btn-hover); }
    .btn-digit:active { background: var(--btn-active); }

    /* ── Last-pressed flash ─────────────────── */
    @keyframes btn-flash {
      0%   { box-shadow: inset 0 0 0 100px rgba(255,255,255,0.28); }
      100% { box-shadow: inset 0 0 0 100px rgba(255,255,255,0);    }
    }

    .btn-flash { animation: btn-flash 0.8s ease-out; }

    @keyframes settings-pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    .btn-settings.needs-config {
      color: #ffd166;
      animation: settings-pulse 1.5s ease-in-out infinite;
    }

    /* ── Layout wrapper ────────────────────────── */
    body {
      align-items: flex-end;
      padding-right: max(40px, env(safe-area-inset-right));
      -webkit-app-region: no-drag;
      gap: 0;
    }

    .remote-container {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      position: relative;
      -webkit-app-region: drag;
    }

    .remote {
      position: relative;
      -webkit-app-region: drag;
    }

    /* ── Drawer tab ─────────────────────────────── */
    .drawer-tab {
      position: absolute;
      left: -12px;
      top: 50%;
      transform: translateY(-50%);
      width: 12px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #252525;
      border-radius: 8px 0 0 8px;
      color: var(--text-dim);
      font-size: 9px;
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
      -webkit-app-region: no-drag;
      user-select: none;
      z-index: 10;
    }

    .drawer-tab:hover {
      background: #2e2e2e;
      color: var(--text);
    }

    /* ── Drawer panel ───────────────────────────── */
    .drawer-panel {
      width: 0;
      overflow: hidden;
      transition: width 0.22s ease;
      background: #141414;
      border-radius: 14px 0 0 14px;
      display: flex;
      flex-direction: column;
      align-self: stretch;
      margin-top: 28px;
      margin-bottom: 28px;
      box-shadow: -4px 0 20px rgba(0,0,0,0.5);
      -webkit-app-region: no-drag;
    }

    .remote-container.drawer-open .drawer-panel {
      width: 140px;
    }

    .drawer-apps {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 8px 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .drawer-app-row {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 0 4px;
    }

    .drawer-app-btn {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 6px;
      background: transparent;
      border: none;
      border-radius: 8px;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      text-align: left;
      transition: background 0.12s;
      -webkit-tap-highlight-color: transparent;
      min-width: 0;
      overflow: hidden;
    }

    .drawer-app-btn:hover  { background: var(--btn-hover); }
    .drawer-app-btn:active { background: var(--btn-active); }

    .app-icon { font-size: 14px; flex-shrink: 0; width: 18px; text-align: center; }
    .app-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px; }

    /* ── Drawer drag-and-drop ────────────────────── */
    .drawer-grab-handle {
      font-size: 12px;
      color: var(--text-dim);
      cursor: grab;
      flex-shrink: 0;
      width: 14px;
      text-align: center;
      user-select: none;
      -webkit-app-region: no-drag;
    }
    .drawer-grab-handle:active { cursor: grabbing; }

    .drawer-app-row { position: relative; }
    .drawer-app-row.dragging { opacity: 0.4; }
    .drawer-app-row.drag-over-top    { box-shadow: 0 -2px 0 0 #60cdff; }
    .drawer-app-row.drag-over-bottom { box-shadow: 0  2px 0 0 #60cdff; }

    .drawer-manage-btn {
      width: 100%;
      padding: 8px 0;
      background: transparent;
      border: none;
      border-top: 1px solid rgba(255,255,255,0.06);
      color: var(--text-dim);
      font-size: 11px;
      cursor: pointer;
      transition: color 0.12s, background 0.12s;
      flex-shrink: 0;
    }
    .drawer-manage-btn:hover { color: var(--text); background: rgba(255,255,255,0.04); }

    .drawer-empty {
      font-size: 11px;
      color: var(--text-dim);
      text-align: center;
      padding: 16px 8px;
    }

    /* ── Pinned apps row ────────────────────────── */
    .pinned-apps {
      display: flex;
      gap: 6px;
      justify-content: center;
    }

    .pinned-app-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 16px;
    }

    /* ── YouTube inline input ───────────────────── */
    .yt-input-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 4px 6px;
      width: 100%;
    }

    .yt-input {
      flex: 1;
      min-width: 0;
      background: var(--btn);
      border: 1px solid #2a2a2a;
      color: var(--text);
      padding: 5px 7px;
      border-radius: 6px;
      font-size: 10px;
      outline: none;
      width: 100%;
    }
    .yt-input:focus { border-color: #555; }

    .yt-input-actions {
      display: flex;
      gap: 4px;
    }

    .yt-confirm-btn {
      width: 28px;
      height: 24px;
      border-radius: 6px;
      font-size: 10px;
      flex-shrink: 0;
    }

    .yt-input-err {
      font-size: 9px;
      color: #e74c3c;
    }
  </style>
</head>
<body>

  <div class="remote-container" id="remote-container">

    <div class="drawer-panel" id="drawer-panel">
      <div class="drawer-apps" id="drawer-apps"></div>
      <button class="drawer-manage-btn" id="drawer-manage-btn">⚙ Manage</button>
    </div>

    <div class="remote">
      <div class="drawer-tab" id="drawer-tab">‹</div>

      <div class="power-row">
        <div class="status-dot" id="status-dot"></div>
        <button class="btn-settings" id="btn-settings" onclick="openSettings()" title="Set TV IP">⚙</button>
        <button class="btn-src" data-key="KEY_SOURCE" onclick="sendKey('KEY_SOURCE')" title="Source/Input">SRC</button>
        <button class="btn btn-power" data-key="KEY_POWER" onclick="sendKey('KEY_POWER')">⏻</button>
      </div>

      <div class="ip-row" id="ip-row" hidden>
        <input id="tvip" type="text" inputmode="decimal" placeholder="192.168.x.x">
        <button class="btn btn-apply" onclick="applyIp()">▶</button>
      </div>

      <div class="row">
        <button class="btn btn-sm" data-key="KEY_GUIDE" onclick="sendKey('KEY_GUIDE')">GUIDE</button>
        <button class="btn btn-sm" data-key="KEY_123"   onclick="toggleNumpad()">123</button>
      </div>

      <div class="row">
        <button class="btn btn-color btn-red"    data-key="KEY_RED"    onclick="sendKey('KEY_RED')"></button>
        <button class="btn btn-color btn-green"  data-key="KEY_GREEN"  onclick="sendKey('KEY_GREEN')"></button>
        <button class="btn btn-color btn-yellow" data-key="KEY_YELLOW" onclick="sendKey('KEY_YELLOW')"></button>
        <button class="btn btn-color btn-blue"   data-key="KEY_BLUE"   onclick="sendKey('KEY_BLUE')"></button>
      </div>

      <div class="numpad" id="numpad" hidden>
        <div class="numpad-row">
          <button class="btn-digit" data-key="KEY_1" onclick="sendKey('KEY_1')">1</button>
          <button class="btn-digit" data-key="KEY_2" onclick="sendKey('KEY_2')">2</button>
          <button class="btn-digit" data-key="KEY_3" onclick="sendKey('KEY_3')">3</button>
          <button class="btn-digit" data-key="KEY_4" onclick="sendKey('KEY_4')">4</button>
          <button class="btn-digit" data-key="KEY_5" onclick="sendKey('KEY_5')">5</button>
        </div>
        <div class="numpad-row">
          <button class="btn-digit" data-key="KEY_6" onclick="sendKey('KEY_6')">6</button>
          <button class="btn-digit" data-key="KEY_7" onclick="sendKey('KEY_7')">7</button>
          <button class="btn-digit" data-key="KEY_8" onclick="sendKey('KEY_8')">8</button>
          <button class="btn-digit" data-key="KEY_9" onclick="sendKey('KEY_9')">9</button>
          <button class="btn-digit" data-key="KEY_0" onclick="sendKey('KEY_0')">0</button>
        </div>
      </div>

      <div class="pinned-apps" id="pinned-apps"></div>

      <div class="nav-ring">
        <div class="nav-track"></div>
        <button class="nav-dir nav-up"    data-key="KEY_UP"    onclick="sendKey('KEY_UP')">△</button>
        <button class="nav-dir nav-down"  data-key="KEY_DOWN"  onclick="sendKey('KEY_DOWN')">▽</button>
        <button class="nav-dir nav-left"  data-key="KEY_LEFT"  onclick="sendKey('KEY_LEFT')">◁</button>
        <button class="nav-dir nav-right" data-key="KEY_RIGHT" onclick="sendKey('KEY_RIGHT')">▷</button>
        <button class="nav-ok"            data-key="KEY_ENTER" onclick="sendKey('KEY_ENTER')">OK</button>
      </div>

      <div class="icon-row">
        <button class="btn btn-icon" data-key="KEY_RETURN" title="Back"       onclick="sendKey('KEY_RETURN')" style="font-size:18px">↩</button>
        <button class="btn btn-icon" data-key="KEY_HOME"   title="Home"       onclick="sendKey('KEY_HOME')"   style="font-size:18px">⌂</button>
        <button class="btn btn-icon" data-key="KEY_PLAY"   title="Play/Pause" onclick="sendKey('KEY_PLAY')"   style="font-size:18px">⏵</button>
      </div>

      <div class="icon-row">
        <button class="btn btn-icon" data-key="KEY_REWIND" title="Rewind"       onclick="sendKey('KEY_REWIND')">⏪</button>
        <button class="btn btn-icon" data-key="KEY_STOP"   title="Stop"         onclick="sendKey('KEY_STOP')">⏹</button>
        <button class="btn btn-icon" data-key="KEY_FF"     title="Fast Forward" onclick="sendKey('KEY_FF')">⏩</button>
      </div>

      <div class="icon-row">
        <button class="btn btn-icon" data-key="KEY_EXIT"    title="Exit"     onclick="sendKey('KEY_EXIT')"    style="font-size:11px;font-weight:700;letter-spacing:.5px">EXIT</button>
        <button class="btn btn-icon" data-key="KEY_INFO"    title="Info"     onclick="sendKey('KEY_INFO')"    style="font-size:18px">ⓘ</button>
        <button class="btn btn-icon" data-key="KEY_CAPTION" title="Captions" onclick="sendKey('KEY_CAPTION')" style="font-size:12px;font-weight:700">CC</button>
      </div>

      <div class="rockers">
        <div class="rocker">
          <span class="rocker-label">VOL</span>
          <button class="btn btn-rocker" data-key="KEY_VOLUP"   onclick="sendKey('KEY_VOLUP')">+</button>
          <button class="btn btn-rocker" data-key="KEY_VOLDOWN" onclick="sendKey('KEY_VOLDOWN')">−</button>
        </div>
        <div class="rocker rocker-mute">
          <span class="rocker-label">MUTE</span>
          <button class="btn btn-icon" data-key="KEY_MUTE" onclick="sendKey('KEY_MUTE')" title="Mute">🔇</button>
        </div>
        <div class="rocker">
          <span class="rocker-label">CH</span>
          <button class="btn btn-rocker" data-key="KEY_CHUP"   onclick="sendKey('KEY_CHUP')">⌃</button>
          <button class="btn btn-rocker" data-key="KEY_CHDOWN" onclick="sendKey('KEY_CHDOWN')">⌄</button>
        </div>
      </div>

    </div><!-- /.remote -->

  </div><!-- /.remote-container -->

  <script src="catalog.js"></script>
  <script src="remote.js"></script>
</body>
</html>
