<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TV Remote">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>TV Remote</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    :root {
      --bg:        #0f0f0f;
      --surface:   #141414;
      --btn:       #1e1e1e;
      --btn-hi:    #2a2a2a;
      --btn-act:   #333333;
      --text:      #e0e0e0;
      --dim:       #4a4a4a;
      --red:       #c0392b;
      --accent:    #60cdff;
      --pad:       max(22px, env(safe-area-inset-left));
    }

    html, body { height: 100%; background: var(--surface); }

    body {
      color: var(--text);
      font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
      display: flex;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    button { outline: none; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; border: none; }
    input  { outline: none; font-family: inherit; }

    /* ── Remote fills entire screen ──────────────────────────────────────── */
    .remote {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding:
        max(18px, env(safe-area-inset-top))
        var(--pad)
        max(36px, env(safe-area-inset-bottom))
        var(--pad);
    }

    /* ── Generic button ──────────────────────────────────────────────────── */
    .btn {
      background: var(--btn);
      border: none;
      color: var(--text);
      border-radius: 12px;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s;
    }
    .btn:active { background: var(--btn-act); }

    /* ── Status dot ──────────────────────────────────────────────────────── */
    .status-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
      background: radial-gradient(circle at 35% 30%, #2a2a2a, #111);
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
      transition: background 0.3s, box-shadow 0.3s;
    }
    .status-dot.connecting {
      background: radial-gradient(circle at 35% 30%, #ffd166, #e67e22);
      box-shadow: 0 0 8px 2px rgba(230,126,34,0.5), inset 0 1px 2px rgba(255,255,255,0.2);
    }
    .status-dot.ok {
      background: radial-gradient(circle at 35% 30%, #6ee88a, #27ae60);
      box-shadow: 0 0 8px 2px rgba(39,174,96,0.5), inset 0 1px 2px rgba(255,255,255,0.2);
    }
    .status-dot.err {
      background: radial-gradient(circle at 35% 30%, #f1665a, #c0392b);
      box-shadow: 0 0 8px 2px rgba(192,57,43,0.5), inset 0 1px 2px rgba(255,255,255,0.2);
    }

    /* ── Power row ───────────────────────────────────────────────────────── */
    .power-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .spacer { flex: 1; }

    .btn-settings {
      width: 38px; height: 38px; border-radius: 50%;
      background: transparent; border: none; color: var(--dim);
      font-size: 18px; display: flex; align-items: center; justify-content: center;
      transition: color 0.12s;
    }
    .btn-settings:active { color: var(--text); }
    .btn-settings.open   { color: var(--text); }
    .btn-settings.needs-config {
      color: #ffd166;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    .btn-src {
      background: transparent; border: none; color: var(--dim);
      font-size: 9px; font-weight: 700; letter-spacing: 0.4px;
      padding: 8px; transition: color 0.12s;
    }
    .btn-src:active { color: var(--text); }

    .btn-power {
      height: 32px; padding: 0 18px;
      border-radius: 16px; background: var(--red);
      font-size: 14px; color: var(--text);
    }
    .btn-power:active { opacity: 0.8; }

    /* ── Settings panel ──────────────────────────────────────────────────── */
    .settings-panel {
      display: flex; flex-direction: column; gap: 8px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 16px;
      padding: 14px;
    }

    .btn-discover {
      width: 100%; padding: 12px;
      border-radius: 10px; font-size: 14px;
      background: var(--btn);
      border: 1px solid rgba(255,255,255,0.09);
      color: var(--text);
    }
    .btn-discover:active   { background: var(--btn-act); }
    .btn-discover:disabled { opacity: 0.5; }

    .discover-results { display: flex; flex-direction: column; gap: 6px; }

    .discover-tv-btn {
      width: 100%; padding: 10px 14px;
      background: var(--btn); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px; color: var(--text);
      font-size: 13px; text-align: left;
      display: flex; flex-direction: column; gap: 2px;
    }
    .discover-tv-btn:active { background: var(--btn-act); }
    .discover-tv-ip { color: var(--dim); font-size: 11px; }

    .ip-row { display: flex; gap: 8px; }
    .ip-row input {
      flex: 1; min-width: 0;
      background: var(--btn); border: 1px solid rgba(255,255,255,0.09);
      color: var(--text); padding: 10px 12px; border-radius: 10px; font-size: 14px;
    }
    .ip-row input:focus { border-color: rgba(255,255,255,0.25); }
    .btn-apply {
      width: 44px; height: 44px; border-radius: 10px; font-size: 14px; flex-shrink: 0;
    }

    /* ── Divider ─────────────────────────────────────────────────────────── */
    .divider {
      height: 1px; background: rgba(255,255,255,0.055); margin: 2px 0;
    }

    /* ── Button row (GUIDE / 123 / Apps) ─────────────────────────────────── */
    .row { display: flex; gap: 10px; }
    .btn-sm {
      flex: 1; height: 52px; border-radius: 14px; font-size: 14px; font-weight: 500;
    }

    /* ── Colour buttons ──────────────────────────────────────────────────── */
    .color-row {
      display: flex; justify-content: space-evenly; align-items: center;
    }
    .btn-color {
      width: 26px; height: 26px; border-radius: 50%; border: none;
    }
    .btn-red    { background: #e74c3c; }
    .btn-green  { background: #2ecc71; }
    .btn-yellow { background: #f1c40f; }
    .btn-blue   { background: #3498db; }
    .btn-color:active { opacity: 0.7; transform: scale(0.92); }

    /* ── Numpad ──────────────────────────────────────────────────────────── */
    .numpad { display: flex; flex-direction: column; gap: 8px; }
    .numpad-row { display: flex; gap: 10px; }
    .btn-digit {
      flex: 1; height: 48px; border-radius: 12px;
      background: var(--btn); border: none; color: var(--text); font-size: 16px;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-digit:active { background: var(--btn-act); }

    /* ── Pinned apps ─────────────────────────────────────────────────────── */
    .pinned-apps {
      display: flex; justify-content: space-evenly;
    }
    .pinned-app-btn {
      width: clamp(58px, 18vw, 72px);
      height: clamp(58px, 18vw, 72px);
      border-radius: 50%; font-size: clamp(20px, 6vw, 28px);
    }
    .btn.pressing, .app-row-launch.pressing {
      opacity: 0.6;
      transform: scale(0.94);
      transition: opacity 0.1s, transform 0.1s;
    }

    /* ── Navigation ring ─────────────────────────────────────────────────── */
    .nav-ring {
      position: relative;
      width:  min(220px, 56vw);
      height: min(220px, 56vw);
      border-radius: 50%; overflow: hidden;
      align-self: center; flex-shrink: 0;
    }
    .nav-track { position: absolute; inset: 0; background: var(--btn); }
    .nav-dir {
      position: absolute; inset: 0; background: transparent; border: none;
      color: var(--dim); font-size: clamp(14px, 4vw, 18px);
      display: flex; transition: background 0.1s;
    }
    .nav-dir:active { color: var(--text); background: rgba(255,255,255,0.14); }
    .nav-up    { clip-path: polygon(0% 0%,100% 0%,50% 50%);     align-items:flex-start; justify-content:center;     padding-top:    clamp(10px,3vw,14px); }
    .nav-down  { clip-path: polygon(0% 100%,100% 100%,50% 50%); align-items:flex-end;   justify-content:center;     padding-bottom: clamp(10px,3vw,14px); }
    .nav-left  { clip-path: polygon(0% 0%,0% 100%,50% 50%);     align-items:center;     justify-content:flex-start; padding-left:   clamp(10px,3vw,14px); }
    .nav-right { clip-path: polygon(100% 0%,100% 100%,50% 50%); align-items:center;     justify-content:flex-end;   padding-right:  clamp(10px,3vw,14px); }
    .nav-ok {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: min(64px, 17vw); height: min(64px, 17vw);
      border-radius: 50%; z-index: 1;
      background: var(--btn-hi); border: none; color: var(--text);
      font-size: clamp(13px, 3.5vw, 16px);
      display: flex; align-items: center; justify-content: center;
      transition: background 0.1s;
    }
    .nav-ok:active { background: var(--btn-act); }

    /* ── Icon rows ───────────────────────────────────────────────────────── */
    .icon-row {
      display: flex; justify-content: space-evenly; align-items: center;
    }
    .btn-icon {
      width: clamp(54px, 15vw, 68px);
      height: clamp(54px, 15vw, 68px);
      border-radius: 50%; font-size: clamp(18px, 5vw, 24px);
    }

    /* ── Rockers ─────────────────────────────────────────────────────────── */
    .rockers { display: flex; gap: 14px; align-items: stretch; }
    .rocker { flex: 1; display: flex; flex-direction: column; align-items: stretch; gap: 6px; }
    .rocker-mute { justify-content: center; align-items: center; }
    .rocker-label {
      font-size: 10px; color: var(--dim); letter-spacing: 0.6px;
      text-align: center; text-transform: uppercase; margin-bottom: 2px;
    }
    .btn-rocker {
      flex: 1; min-height: 54px; border-radius: 14px;
      font-size: clamp(22px, 6vw, 28px); font-weight: 300;
    }
    .btn-mute {
      width: clamp(54px, 15vw, 68px);
      height: clamp(54px, 15vw, 68px);
      border-radius: 50%; font-size: clamp(20px, 5.5vw, 26px);
    }

    /* ── Flash animation ─────────────────────────────────────────────────── */
    @keyframes btn-flash {
      0%   { box-shadow: inset 0 0 0 100px rgba(255,255,255,0.25); }
      100% { box-shadow: inset 0 0 0 100px rgba(255,255,255,0); }
    }
    .btn-flash { animation: btn-flash 0.7s ease-out; }

    /* ── Full-screen app modal ───────────────────────────────────────────── */
    .app-modal {
      position: fixed; inset: 0; z-index: 100;
      background: #181818;
      display: flex; flex-direction: column;
      padding-top:    env(safe-area-inset-top);
      padding-bottom: max(20px, env(safe-area-inset-bottom));
    }

    .app-modal-header {
      display: flex; align-items: center; padding: 18px 20px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.07); gap: 10px; flex-shrink: 0;
    }
    .app-modal-title { font-size: 18px; font-weight: 600; flex: 1; }

    .btn-modal-action {
      background: rgba(255,255,255,0.09); border: none; color: var(--text);
      font-size: 14px; padding: 0 16px; border-radius: 10px; height: 36px;
      display: flex; align-items: center;
    }
    .btn-modal-action:active { background: rgba(255,255,255,0.16); }
    .btn-modal-action.active  { color: var(--accent); }

    .app-list {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    }

    .app-row {
      display: flex; align-items: center;
      padding: 0 20px; min-height: 58px; gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .app-row-launch {
      flex: 1; display: flex; align-items: center; gap: 16px;
      background: transparent; border: none; color: var(--text);
      text-align: left; padding: 10px 0; min-width: 0;
    }
    .app-row-launch:active { opacity: 0.55; }
    .app-row-icon { font-size: 24px; width: 32px; text-align: center; flex-shrink: 0; }
    .app-row-name { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .app-row-move { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
    .btn-move {
      width: 34px; height: 28px; background: rgba(255,255,255,0.07); border: none;
      color: var(--dim); border-radius: 6px; font-size: 13px;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-move:active  { background: rgba(255,255,255,0.14); color: var(--text); }
    .btn-move:disabled { opacity: 0.2; pointer-events: none; }

    .btn-remove {
      width: 34px; height: 34px; background: rgba(192,57,43,0.18); border: none;
      color: #e74c3c; border-radius: 10px; font-size: 20px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .btn-remove:active { background: rgba(192,57,43,0.35); }

    .app-search {
      border-top: 1px solid rgba(255,255,255,0.07);
      padding: 14px 20px; display: flex; flex-direction: column; gap: 10px;
      flex-shrink: 0; max-height: 45vh;
    }
    .app-search input {
      width: 100%; background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
      color: var(--text); font-size: 16px; padding: 12px 16px;
    }
    .app-search input:focus { border-color: var(--accent); }

    .search-results { overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; }
    .search-result-btn {
      display: flex; align-items: center; gap: 14px; padding: 12px 2px;
      background: transparent; border: none;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      color: var(--text); font-size: 15px; text-align: left; width: 100%;
    }
    .search-result-btn:active  { opacity: 0.55; }
    .search-result-btn:disabled { opacity: 0.4; }
    .search-added { color: var(--accent); font-size: 12px; margin-left: auto; flex-shrink: 0; }

    /* ── Region select (settings panel) ─────────────────────────────────── */
    .region-select-mobile {
      width: 100%;
      background: var(--btn);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 10px;
      color: var(--text);
      font-size: 14px;
      padding: 10px 12px;
      height: 44px;
      appearance: auto;
    }
    .region-select-mobile option { background: #1f1f1f; color: var(--text); }

    /* ── Reset to defaults (app search panel) ───────────────────────────── */
    .btn-reset-defaults {
      padding: 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      color: var(--dim);
      font-size: 13px;
      text-align: center;
      width: 100%;
    }
    .btn-reset-defaults:active { background: rgba(255,255,255,0.12); color: var(--text); }

    /* ── YouTube popup ───────────────────────────────────────────────────── */
    #yt-overlay {
      position: fixed; inset: 0; z-index: 200; display: none;
      align-items: flex-end; justify-content: center;
      background: rgba(0,0,0,0.6);
      padding-bottom: max(24px, env(safe-area-inset-bottom));
    }
    #yt-overlay.visible { display: flex; }
    #yt-popup {
      background: #252525; border-radius: 20px 20px 16px 16px;
      padding: 24px 24px 20px;
      width: min(480px, 100%); max-width: 100%;
      display: flex; flex-direction: column; gap: 14px;
    }
    #yt-popup h3 { font-size: 17px; font-weight: 600; }
    #yt-url-input {
      height: 46px; background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1); border-bottom-color: rgba(255,255,255,0.4);
      border-radius: 10px; color: var(--text); font-size: 16px; padding: 0 14px; width: 100%;
    }
    #yt-url-input:focus { border-bottom-color: var(--accent); outline: none; }
    #yt-err { font-size: 13px; color: #f1665a; margin-top: -4px; }
    .yt-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .yt-actions button {
      height: 44px; padding: 0 20px; border-radius: 12px;
      font-size: 15px; border: none; font-family: inherit;
    }
    #yt-cancel-btn { background: rgba(255,255,255,0.09); color: var(--text); }
    #yt-play-btn   { background: #0067c0; color: #fff; font-weight: 500; }
  </style>
</head>
<body>

  <div class="remote" id="remote">

    <!-- Status + settings + source + power -->
    <div class="power-row">
      <div class="status-dot" id="status-dot"></div>
      <button class="btn-settings" id="btn-settings" onclick="toggleSettings()">⚙</button>
      <span class="spacer"></span>
      <button class="btn-src" data-key="KEY_SOURCE" onclick="sendKey('KEY_SOURCE')">SRC</button>
      <button class="btn btn-power" data-key="KEY_POWER" onclick="sendKey('KEY_POWER')">⏻</button>
    </div>

    <!-- Inline settings panel -->
    <div class="settings-panel" id="settings-panel" hidden>
      <button class="btn-discover" id="discover-btn" onclick="discoverTvs()">Scan for TVs</button>
      <div class="discover-results" id="discover-results"></div>
      <div class="ip-row">
        <input id="tvip" type="text" inputmode="text" placeholder="192.168.x.x"
               autocomplete="off" spellcheck="false">
        <button class="btn btn-apply" onclick="applyIp()">▶</button>
      </div>
      <select id="region-select" class="region-select-mobile"></select>
    </div>

    <div class="divider"></div>

    <!-- GUIDE / 123 / Apps -->
    <div class="row">
      <button class="btn btn-sm" data-key="KEY_GUIDE" onclick="sendKey('KEY_GUIDE')">GUIDE</button>
      <button class="btn btn-sm" data-key="KEY_123"   onclick="toggleNumpad()">123</button>
      <button class="btn btn-sm"                       onclick="openAppModal()">Apps</button>
    </div>

    <!-- Colour buttons -->
    <div class="color-row">
      <button class="btn-color btn-red"    data-key="KEY_RED"    onclick="sendKey('KEY_RED')"></button>
      <button class="btn-color btn-green"  data-key="KEY_GREEN"  onclick="sendKey('KEY_GREEN')"></button>
      <button class="btn-color btn-yellow" data-key="KEY_YELLOW" onclick="sendKey('KEY_YELLOW')"></button>
      <button class="btn-color btn-blue"   data-key="KEY_BLUE"   onclick="sendKey('KEY_BLUE')"></button>
    </div>

    <!-- Numpad (hidden) -->
    <div class="numpad" id="numpad" hidden>
      <div class="numpad-row">
        <button class="btn-digit" data-key="KEY_1" onclick="sendKey('KEY_1')">1</button>
        <button class="btn-digit" data-key="KEY_2" onclick="sendKey('KEY_2')">2</button>
        <button class="btn-digit" data-key="KEY_3" onclick="sendKey('KEY_3')">3</button>
        <button class="btn-digit" data-key="KEY_4" onclick="sendKey('KEY_4')">4</button>
        <button class="btn-digit" data-key="KEY_5" onclick="sendKey('KEY_5')">5</button>
      </div>
      <div class="numpad-row">
        <button class="btn-digit" data-key="KEY_6" onclick="sendKey('KEY_6')">6</button>
        <button class="btn-digit" data-key="KEY_7" onclick="sendKey('KEY_7')">7</button>
        <button class="btn-digit" data-key="KEY_8" onclick="sendKey('KEY_8')">8</button>
        <button class="btn-digit" data-key="KEY_9" onclick="sendKey('KEY_9')">9</button>
        <button class="btn-digit" data-key="KEY_0" onclick="sendKey('KEY_0')">0</button>
      </div>
    </div>

    <!-- Pinned apps quick-launch -->
    <div class="pinned-apps" id="pinned-apps"></div>

    <div class="divider"></div>

    <!-- Navigation ring -->
    <div class="nav-ring">
      <div class="nav-track"></div>
      <button class="nav-dir nav-up"    data-key="KEY_UP"    onclick="sendKey('KEY_UP')">△</button>
      <button class="nav-dir nav-down"  data-key="KEY_DOWN"  onclick="sendKey('KEY_DOWN')">▽</button>
      <button class="nav-dir nav-left"  data-key="KEY_LEFT"  onclick="sendKey('KEY_LEFT')">◁</button>
      <button class="nav-dir nav-right" data-key="KEY_RIGHT" onclick="sendKey('KEY_RIGHT')">▷</button>
      <button class="nav-ok"            data-key="KEY_ENTER" onclick="sendKey('KEY_ENTER')">OK</button>
    </div>

    <!-- Back / Home / Play -->
    <div class="icon-row">
      <button class="btn btn-icon" data-key="KEY_RETURN" onclick="sendKey('KEY_RETURN')" style="font-size:clamp(18px,5vw,24px)">↩</button>
      <button class="btn btn-icon" data-key="KEY_HOME"   onclick="sendKey('KEY_HOME')"   style="font-size:clamp(18px,5vw,24px)">⌂</button>
      <button class="btn btn-icon" data-key="KEY_PLAY"   onclick="sendKey('KEY_PLAY')"   style="font-size:clamp(18px,5vw,24px)">⏵</button>
    </div>

    <!-- Media transport -->
    <div class="icon-row">
      <button class="btn btn-icon" data-key="KEY_REWIND" onclick="sendKey('KEY_REWIND')">⏪</button>
      <button class="btn btn-icon" data-key="KEY_STOP"   onclick="sendKey('KEY_STOP')">⏹</button>
      <button class="btn btn-icon" data-key="KEY_FF"     onclick="sendKey('KEY_FF')">⏩</button>
    </div>

    <!-- Exit / Info / CC -->
    <div class="icon-row">
      <button class="btn btn-icon" data-key="KEY_EXIT"    onclick="sendKey('KEY_EXIT')"    style="font-size:clamp(11px,3vw,14px);font-weight:700;letter-spacing:.5px">EXIT</button>
      <button class="btn btn-icon" data-key="KEY_INFO"    onclick="sendKey('KEY_INFO')"    style="font-size:clamp(18px,5vw,24px)">ⓘ</button>
      <button class="btn btn-icon" data-key="KEY_CAPTION" onclick="sendKey('KEY_CAPTION')" style="font-size:clamp(12px,3.5vw,16px);font-weight:700">CC</button>
    </div>

    <div class="divider"></div>

    <!-- Volume / Mute / Channel -->
    <div class="rockers">
      <div class="rocker">
        <span class="rocker-label">VOL</span>
        <button class="btn btn-rocker" data-key="KEY_VOLUP"   onclick="sendKey('KEY_VOLUP')">+</button>
        <button class="btn btn-rocker" data-key="KEY_VOLDOWN" onclick="sendKey('KEY_VOLDOWN')">−</button>
      </div>
      <div class="rocker rocker-mute">
        <span class="rocker-label">MUTE</span>
        <button class="btn btn-mute" data-key="KEY_MUTE" onclick="sendKey('KEY_MUTE')">🔇</button>
      </div>
      <div class="rocker">
        <span class="rocker-label">CH</span>
        <button class="btn btn-rocker" data-key="KEY_CHUP"   onclick="sendKey('KEY_CHUP')">⌃</button>
        <button class="btn btn-rocker" data-key="KEY_CHDOWN" onclick="sendKey('KEY_CHDOWN')">⌄</button>
      </div>
    </div>

  </div><!-- /.remote -->

  <!-- Full-screen app window -->
  <div class="app-modal" id="app-modal" hidden>
    <div class="app-modal-header">
      <span class="app-modal-title">Apps</span>
      <button class="btn-modal-action" id="btn-edit" onclick="toggleEditMode()">Edit</button>
      <button class="btn-modal-action" onclick="closeAppModal()">✕</button>
    </div>
    <div class="app-list" id="app-list"></div>
    <div class="app-search" id="app-search" hidden>
      <input type="search" id="search-input" placeholder="Search to add apps…"
             inputmode="search" autocomplete="off" oninput="onSearchInput(this.value)">
      <div class="search-results" id="search-results"></div>
      <button class="btn-reset-defaults" onclick="resetToDefaults()">Reset to defaults</button>
    </div>
  </div>

  <!-- YouTube deep-link popup (slides up from bottom) -->
  <div id="yt-overlay">
    <div id="yt-popup">
      <h3>Play YouTube video</h3>
      <input type="text" id="yt-url-input" placeholder="URL or video ID"
             autocomplete="off" spellcheck="false">
      <div id="yt-err" hidden>Not a valid YouTube URL or video ID</div>
      <div class="yt-actions">
        <button id="yt-cancel-btn">Cancel</button>
        <button id="yt-play-btn">Play</button>
      </div>
    </div>
  </div>

  <script src="catalog.js"></script>
  <script src="mobile.js"></script>
</body>
</html>
