<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Type on TV</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      color: rgba(255,255,255,0.95);
      background: #252525;
      display: flex; flex-direction: column; gap: 12px;
      padding: 18px 20px 16px;
      user-select: none;
    }
    button, input { -webkit-app-region: no-drag; font-family: inherit; }
    h3 { font-size: 13px; font-weight: 600; -webkit-app-region: drag; cursor: move; }
    .modes { display: flex; gap: 4px; }
    .modes button {
      flex: 1; height: 26px; border-radius: 4px; font-size: 12px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.09);
      color: rgba(255,255,255,0.8); cursor: pointer;
    }
    .modes button.active { background: #0067c0; color: #fff; border-color: transparent; }
    #hint { font-size: 11px; color: rgba(255,255,255,0.55); margin-top: -4px; }
    #txt-input {
      height: 30px; background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.09); border-bottom-color: rgba(255,255,255,0.45);
      border-radius: 4px; color: inherit; font-size: 13px; padding: 0 10px; outline: none; width: 100%;
      user-select: text;
    }
    #txt-input:focus { border-bottom-color: #60cdff; }
    #live {
      height: 30px; line-height: 28px; padding: 0 10px; border-radius: 4px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.09);
      border-bottom-color: #60cdff; white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; direction: rtl; text-align: left;
    }
    #live.empty { color: rgba(255,255,255,0.4); direction: ltr; }
    .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: auto; }
    .actions button {
      height: 28px; padding: 0 14px; border-radius: 4px; font-size: 13px; cursor: pointer;
      border: 1px solid transparent;
    }
    #cancel-btn { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.09); color: rgba(255,255,255,0.9); }
    #cancel-btn:hover { background: rgba(255,255,255,0.1); }
    #send-btn { background: #0067c0; color: #fff; }
    #send-btn:hover { background: #1975c9; }
    #send-btn[hidden] { display: none; }
    #pad {
      flex: 1; min-height: 200px; border-radius: 6px; cursor: crosshair; touch-action: none;
      background: rgba(255,255,255,0.05); border: 1px dashed rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: rgba(255,255,255,0.4); -webkit-app-region: no-drag;
    }
    #pad.active { background: rgba(255,255,255,0.09); border-style: solid; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h3>Type on TV</h3>
  <div class="modes">
    <button data-mode="live">Live keys</button>
    <button data-mode="text">Text</button>
  </div>
  <div id="hint"></div>
  <input type="text" id="txt-input" placeholder="Focus a text field on the TV first"
         autocomplete="off" spellcheck="false">
  <div id="live" hidden></div>
  <div id="pad">Trackpad — drag to move, tap to click, right-click to right-click</div>
  <div class="actions">
    <button id="cancel-btn">Cancel</button>
    <button id="send-btn">Send</button>
  </div>

  <script>
    const api       = window.textDialogAPI;
    const input     = document.getElementById('txt-input');
    const sendBtn   = document.getElementById('send-btn');
    const cancelBtn = document.getElementById('cancel-btn');
    const hint      = document.getElementById('hint');
    const live      = document.getElementById('live');
    const modeBtns  = document.querySelectorAll('[data-mode]');

    // Live mode: arrows act as remote keys, Enter accepts the entry; everything else is typed text.
    const LIVE_NAV_KEYS = {
      ArrowUp: 'KEY_UP', ArrowDown: 'KEY_DOWN',
      ArrowLeft: 'KEY_LEFT', ArrowRight: 'KEY_RIGHT',
    };

    const pad = document.getElementById('pad');
    // Live mode needs no focused field: keys are captured at the window level and
    // the whole buffer is mirrored to the TV on each change.
    let liveBuf = '';
    function renderLive() {
      live.textContent = liveBuf || 'Just start typing…';
      live.classList.toggle('empty', !liveBuf);
    }
    function setLiveBuf(v) { liveBuf = v; renderLive(); api.sendText(v); }

    let mode = 'text';
    try { mode = localStorage.getItem('txtmode') === 'live' ? 'live' : 'text'; } catch (_) {}

    function setMode(m) {
      mode = m;
      try { localStorage.setItem('txtmode', m); } catch (_) {}
      modeBtns.forEach(b => b.classList.toggle('active', b.dataset.mode === m));
      sendBtn.hidden = m === 'live';
      cancelBtn.textContent = m === 'live' ? 'Done' : 'Cancel';
      hint.textContent = m === 'live'
        ? 'The field is mirrored to the TV as you type. Enter accepts; arrows act as remote keys.'
        : 'Edit freely, then Send to type the whole string on the TV.';
      input.value = '';
      liveBuf = '';
      renderLive();
      input.hidden = m === 'live';
      live.hidden  = m !== 'live';
      if (m === 'text') input.focus();
    }

    function submit() {
      if (input.value) api.sendText(input.value);
      api.end();
      api.close();
    }

    modeBtns.forEach(b => { b.onclick = () => { setMode(b.dataset.mode); b.blur(); }; });
    sendBtn.onclick   = submit;
    cancelBtn.onclick = () => api.close();

    input.onkeydown = e => {
      if (e.key === 'Enter') { e.preventDefault(); submit(); } // Esc is handled at window level
    };

    window.addEventListener('keydown', e => {
      if (e.key === 'Escape') { api.close(); return; }
      if (mode !== 'live' || e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key === 'Enter')          { e.preventDefault(); api.end(); setLiveBuf(''); return; }
      if (e.key === 'Backspace')      { e.preventDefault(); if (liveBuf) setLiveBuf(liveBuf.slice(0, -1)); return; }
      const nav = LIVE_NAV_KEYS[e.key];
      if (nav)                        { e.preventDefault(); api.sendKey(nav); return; }
      if (e.key.length === 1)         { e.preventDefault(); setLiveBuf(liveBuf + e.key); }
    });
    window.addEventListener('paste', e => {
      if (mode !== 'live') return;
      const t = e.clipboardData.getData('text');
      if (t) { e.preventDefault(); setLiveBuf(liveBuf + t); }
    });

    // ── Trackpad → relative movement (the TV treats Move x/y as a delta) ──
    const SPEED = 2.5;
    let pendX = 0, pendY = 0; // movement not yet sent (sub-pixel remainders stay here)
    let moved = 0, downAt = 0, lastSent = 0;

    // Pointer lock hides the real cursor and keeps delivering movement even when
    // the drag leaves the pad, so nothing leaks to the windows underneath.
    let locked = false, pressed = false;

    pad.onmousedown = e => {
      if (e.button !== 0) return;
      pressed = true;
      moved = 0;
      downAt = Date.now();
      pad.classList.add('active');
      pad.requestPointerLock();
    };
    document.addEventListener('pointerlockchange', () => {
      locked = document.pointerLockElement === pad;
      if (!locked && pressed) endDrag();   // lock lost (e.g. Esc) before mouseup
      if (locked && !pressed) document.exitPointerLock(); // quick tap: released before lock engaged
    });
    document.addEventListener('mousemove', e => {
      if (!locked) return;
      moved += Math.abs(e.movementX) + Math.abs(e.movementY);
      pendX += e.movementX * SPEED;
      pendY += e.movementY * SPEED;
      const now = Date.now();
      if (now - lastSent >= 16) { lastSent = now; flushMove(); }
    });
    function flushMove() {
      const dx = Math.trunc(pendX), dy = Math.trunc(pendY);
      if (!dx && !dy) return;
      pendX -= dx; pendY -= dy;
      api.pointer('Move', dx, dy);
    }
    function endDrag() {
      if (!pressed) return;
      pressed = false;
      pad.classList.remove('active');
      flushMove();
      pendX = pendY = 0;
      if (moved < 6 && Date.now() - downAt < 400) api.pointer('LeftClick');
      if (document.pointerLockElement) document.exitPointerLock();
    }
    document.addEventListener('mouseup', e => { if (e.button === 0) endDrag(); });
    pad.oncontextmenu = e => { e.preventDefault(); api.pointer('RightClick'); };

    setMode(mode);
  </script>
</body>
</html>
