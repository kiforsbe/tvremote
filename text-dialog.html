<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Type on TV</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      color: rgba(255,255,255,0.95);
      background: #252525;
      display: flex; flex-direction: column; gap: 12px;
      padding: 18px 20px 16px;
      -webkit-app-region: drag;
      user-select: none;
    }
    button, input { -webkit-app-region: no-drag; font-family: inherit; }
    h3 { font-size: 13px; font-weight: 600; }
    .modes { display: flex; gap: 4px; }
    .modes button {
      flex: 1; height: 26px; border-radius: 4px; font-size: 12px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.09);
      color: rgba(255,255,255,0.8); cursor: pointer;
    }
    .modes button.active { background: #0067c0; color: #fff; border-color: transparent; }
    #hint { font-size: 11px; color: rgba(255,255,255,0.55); margin-top: -4px; }
    #txt-input {
      height: 30px; background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.09); border-bottom-color: rgba(255,255,255,0.45);
      border-radius: 4px; color: inherit; font-size: 13px; padding: 0 10px; outline: none; width: 100%;
      user-select: text;
    }
    #txt-input:focus { border-bottom-color: #60cdff; }
    .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: auto; }
    .actions button {
      height: 28px; padding: 0 14px; border-radius: 4px; font-size: 13px; cursor: pointer;
      border: 1px solid transparent;
    }
    #cancel-btn { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.09); color: rgba(255,255,255,0.9); }
    #cancel-btn:hover { background: rgba(255,255,255,0.1); }
    #send-btn { background: #0067c0; color: #fff; }
    #send-btn:hover { background: #1975c9; }
    #send-btn[hidden] { display: none; }
    #pad {
      flex: 1; border-radius: 6px; cursor: crosshair; touch-action: none;
      background: rgba(255,255,255,0.05); border: 1px dashed rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: rgba(255,255,255,0.4); -webkit-app-region: no-drag;
    }
    #pad:active { background: rgba(255,255,255,0.09); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h3>Type on TV</h3>
  <div class="modes">
    <button data-mode="live">Live keys</button>
    <button data-mode="text">Text</button>
    <button data-mode="pointer">Pointer</button>
  </div>
  <div id="hint"></div>
  <input type="text" id="txt-input" placeholder="Focus a text field on the TV first"
         autocomplete="off" spellcheck="false">
  <div id="pad" hidden>trackpad</div>
  <div class="actions">
    <button id="cancel-btn">Cancel</button>
    <button id="send-btn">Send</button>
  </div>

  <script>
    const api       = window.textDialogAPI;
    const input     = document.getElementById('txt-input');
    const sendBtn   = document.getElementById('send-btn');
    const cancelBtn = document.getElementById('cancel-btn');
    const hint      = document.getElementById('hint');
    const modeBtns  = document.querySelectorAll('[data-mode]');

    // Live mode: arrows act as remote keys, Enter accepts the entry; everything else is typed text.
    const LIVE_NAV_KEYS = {
      ArrowUp: 'KEY_UP', ArrowDown: 'KEY_DOWN',
      ArrowLeft: 'KEY_LEFT', ArrowRight: 'KEY_RIGHT',
    };

    const pad = document.getElementById('pad');
    let mode = 'text';
    try { const m = localStorage.getItem('txtmode'); if (['live', 'pointer'].includes(m)) mode = m; } catch (_) {}

    function setMode(m) {
      mode = m;
      try { localStorage.setItem('txtmode', m); } catch (_) {}
      modeBtns.forEach(b => b.classList.toggle('active', b.dataset.mode === m));
      sendBtn.hidden = m !== 'text';
      input.hidden   = m === 'pointer';
      pad.hidden     = m !== 'pointer';
      cancelBtn.textContent = m === 'text' ? 'Cancel' : 'Done';
      hint.textContent = {
        live:    'The field is mirrored to the TV as you type. Enter accepts; arrows act as remote keys.',
        text:    'Edit freely, then Send to type the whole string on the TV.',
        pointer: 'Drag to move the TV cursor, tap to left-click, right-click to right-click.',
      }[m];
      input.value = '';
      if (m !== 'pointer') input.focus();
    }

    function submit() {
      if (input.value) api.sendText(input.value);
      api.end();
      api.close();
    }

    modeBtns.forEach(b => { b.onclick = () => setMode(b.dataset.mode); });
    sendBtn.onclick   = submit;
    cancelBtn.onclick = () => api.close();

    input.onkeydown = e => {
      if (e.key === 'Escape') { e.preventDefault(); api.close(); return; }
      if (mode === 'text') {
        if (e.key === 'Enter') { e.preventDefault(); submit(); }
        return;
      }
      if (e.key === 'Enter') { e.preventDefault(); api.end(); input.value = ''; return; }
      const nav = LIVE_NAV_KEYS[e.key];
      if (nav) {
        e.preventDefault();
        api.sendKey(nav);
      }
    };
    // Live mode mirrors the whole field to the TV on every change.
    input.oninput = () => { if (mode === 'live') api.sendText(input.value); };

    // ── Pointer mode: trackpad → absolute TV-screen coordinates ────────────
    const TV_W = 1920, TV_H = 1080, SPEED = 3;
    let cx = TV_W / 2, cy = TV_H / 2;
    let last = null, moved = 0, downAt = 0, lastSent = 0;

    pad.onpointerdown = e => {
      if (e.button !== 0) return;
      pad.setPointerCapture(e.pointerId);
      last = { x: e.clientX, y: e.clientY };
      moved = 0;
      downAt = Date.now();
    };
    pad.onpointermove = e => {
      if (!last) return;
      const dx = e.clientX - last.x, dy = e.clientY - last.y;
      last = { x: e.clientX, y: e.clientY };
      moved += Math.abs(dx) + Math.abs(dy);
      cx = Math.max(0, Math.min(TV_W, cx + dx * SPEED));
      cy = Math.max(0, Math.min(TV_H, cy + dy * SPEED));
      const now = Date.now();
      if (now - lastSent >= 30) { lastSent = now; api.pointer('Move', cx, cy); }
    };
    pad.onpointerup = () => {
      if (!last) return;
      last = null;
      api.pointer('Move', cx, cy); // flush final position
      if (moved < 6 && Date.now() - downAt < 400) api.pointer('LeftClick');
    };
    pad.oncontextmenu = e => { e.preventDefault(); api.pointer('RightClick'); };
    window.addEventListener('keydown', e => { if (e.key === 'Escape') api.close(); });

    setMode(mode);
  </script>
</body>
</html>
